---
name: Release Arm Build

"on":
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Chef Server tag or commit SHA to build"
        required: false
        default: ""
      arm_iteration:
        description: "ARM rebuild iteration"
        required: false
        default: "1"
      publish:
        description: "Publish a GitHub Release"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: chef-arm-release
  cancel-in-progress: false

env:
  BUILD_RUBY_VERSION: "3.1"

jobs:
  release:
    if: github.repository == 'GrantBirki/chef-arm'
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      artifact-dir: ${{ steps.build.outputs.artifact_dir }}
      package-path: ${{ steps.build.outputs.package_path }}
      release-tag: ${{ steps.build.outputs.release_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.BUILD_RUBY_VERSION }}
          bundler-cache: false

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dpkg-dev \
            fakeroot \
            git \
            libffi-dev \
            liblzma-dev \
            libreadline-dev \
            libssl-dev \
            patch \
            pkg-config \
            rsync \
            shellcheck \
            yamllint \
            zlib1g-dev

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint

      - name: build package
        id: build
        run: |
          if [ -n "${{ inputs.upstream_ref }}" ]; then
            script/build \
              "${{ inputs.upstream_ref }}" \
              --iteration "${{ inputs.arm_iteration }}"
          else
            script/build --iteration "${{ inputs.arm_iteration }}"
          fi

      - name: smoke test package
        run: script/test "${{ steps.build.outputs.package_path }}"

      - name: generate spdx sbom
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.build.outputs.package_path }}
          format: spdx-json
          output-file: ${{ steps.build.outputs.artifact_dir }}/sbom.spdx.json
          artifact-name: ${{ steps.build.outputs.release_tag }}-sbom
          upload-artifact: true
          upload-release-assets: false

      - name: upload artifact
        uses: actions/upload-artifact@v6
        id: upload-artifact
        with:
          name: ${{ steps.build.outputs.release_tag }}
          path: ${{ steps.build.outputs.artifact_dir }}
          retention-days: 5
          if-no-files-found: error

      - name: publish release assets
        if: ${{ inputs.publish }}
        env:
          CHEF_ARM_SBOM_PATH: >-
            ${{ steps.build.outputs.artifact_dir }}/sbom.spdx.json
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.upstream_ref }}" ]; then
            script/release \
              "${{ inputs.upstream_ref }}" \
              --iteration "${{ inputs.arm_iteration }}" \
              --artifact "${{ steps.build.outputs.package_path }}" \
              --publish
          else
            script/release \
              --iteration "${{ inputs.arm_iteration }}" \
              --artifact "${{ steps.build.outputs.package_path }}" \
              --publish
          fi

  sign:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: dist/

      - name: attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/

  verify:
    permissions: {}
    runs-on: ubuntu-latest
    needs:
      - release
      - sign
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: dist/

      - name: verify artifact attestations
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ARTIFACT_PATH: dist/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning for files in $ARTIFACT_PATH"

          find "$ARTIFACT_PATH" -type f | while read -r file; do
            echo "Verifying file: $file"
            workflow_ref="${OWNER}/${REPO}/.github/workflows/release.yml"
            echo "Executing command: gh attestation verify \"$file\" \
              --repo ${OWNER}/${REPO} --signer-workflow ${workflow_ref}"
            gh attestation verify "$file" \
              --repo "${OWNER}/${REPO}" \
              --signer-workflow "$workflow_ref"
          done
