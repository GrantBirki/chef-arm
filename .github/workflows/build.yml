---
name: build

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dpkg-dev \
            fakeroot \
            git \
            libffi-dev \
            liblzma-dev \
            libreadline-dev \
            libssl-dev \
            patch \
            pkg-config \
            rsync \
            zlib1g-dev

      - name: bootstrap
        run: script/bootstrap

      - name: build
        id: build
        run: script/build

      - name: upload
        uses: actions/upload-artifact@v6
        if: ${{ steps.build.outcome == 'success' }}
        with:
          name: ${{ steps.build.outputs.release_tag }}
          path: ${{ steps.build.outputs.artifact_dir }}
          retention-days: 5
          if-no-files-found: error

      - name: test
        run: script/test "${{ steps.build.outputs.package_path }}"
