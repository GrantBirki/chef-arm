---
name: CI

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: install shell linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint

      - name: test
        run: script/test

  build-dry-run:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: validate build path
        run: script/build --dry-run
